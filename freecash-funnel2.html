<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Congratulations — Freecash</title>
<style>:root{--bg:#0e1116;--card:#171a20;--field:#1d222b;--text:#f2f2f2;--muted:#8a8f98;--dim:#5f646d;--accent:#2ee6c8;--cta:#f5484d;--green:#01d676;--purple:#8b5cf6;--glow-card:#141523;--radius:28px;}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}html,body{height:100%;}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}.page{display:none;min-height:100vh;min-height:100svh;flex-direction:column;max-width:560px;margin:0 auto;padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom));}.page.active{display:flex;}.page.active .anim{animation:rise .55s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--d,0s);}@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}@keyframes fcGlow{0%{box-shadow:0 0 10px 2px rgba(1,214,118,0.3);}50%{box-shadow:0 0 40px 4px rgba(1,214,118,0.6);}100%{box-shadow:0 0 10px 2px rgba(1,214,118,0.3);}}@keyframes floatUpDown{0%{transform:translate(0);}50%{transform:translateY(-24px);}100%{transform:translate(0);}}.notif-slot{position:relative;z-index:3;margin:30px auto -16px;width:-moz-fit-content;width:fit-content;max-width:100%;}.notif-float{animation:floatUpDown 3.6s cubic-bezier(.4,0,.2,1) infinite;will-change:transform;}.notif{border-radius:16px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 28px rgba(0,0,0,.28);overflow:hidden;}.notif-inner{padding:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}.notif-left{display:flex;align-items:center;gap:8px;min-width:0;}.notif-appicon{width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;flex:none;}.notif-appicon img{width:100%;height:100%;display:block;border-radius:16px;}.notif-title{color:#000;font-size:14px;font-weight:400;margin-bottom:4px;}.notif-desc{color:#1f2937;font-size:12px;line-height:1.25;}.notif-now{color:#000;font-size:10px;font-weight:500;white-space:nowrap;margin:0 12px 24px;}#page-welcome{justify-content:center;text-align:center;}.welcome-title{font-size:clamp(34px,9vw,50px);font-weight:700;letter-spacing:-0.01em;line-height:1.15;}.welcome-sub{margin-top:14px;font-size:clamp(16px,4.4vw,20px);line-height:1.55;color:var(--muted);font-weight:500;}.welcome-sub .hl{color:var(--green);font-weight:700;}.partner-wrap{margin-top:34px;padding:1.5px;border-radius:calc(var(--radius) + 2px);background:linear-gradient(135deg,var(--green) 0%,rgba(1,214,118,.12) 38%,rgba(1,214,118,.28) 62%,var(--green) 100%);}.partner-card{background:var(--card);border-radius:var(--radius);padding:38px 26px 34px;display:flex;flex-direction:column;align-items:center;}.partner-label{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}.brand-logo{display:block;width:min(240px,68%);height:auto;margin:24px auto 0;}.partner-text{margin-top:20px;font-size:15.5px;color:var(--muted);font-weight:500;}.btn{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;-webkit-user-select:none;user-select:none;}.btn:focus-visible{outline:2px solid var(--green);outline-offset:3px;}.btn-cta{margin-top:24px;padding:19px 24px;border-radius:20px;background:var(--green);color:#141523;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 12px 32px rgba(1,214,118,.3);transition:transform .15s ease,filter .15s ease;}.btn-cta:hover{filter:brightness(1.08);transform:translateY(-1px);}.btn-cta:active{transform:scale(.985);}.partner-caption{margin-top:16px;font-size:13px;color:var(--dim);font-weight:500;}.disclaimers{margin-top:34px;text-align:center;}.disclaimer-1{font-size:12.5px;color:var(--dim);}.disclaimer-rule{width:100%;height:1px;background:rgba(255,255,255,.08);margin:16px 0;border:none;}.disclaimer-2{font-size:11.5px;color:var(--dim);line-height:1.6;padding:0 6px;}#page-birthday{padding-top:clamp(58px,15vh,136px);}.bd-title{font-size:clamp(30px,8vw,40px);font-weight:700;line-height:1.2;}.bd-sub{margin-top:14px;font-size:14.5px;line-height:1.6;color:var(--muted);}.bd-field{margin-top:30px;background:var(--glow-card);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:17px 20px;font-size:16.5px;font-weight:600;color:var(--dim);text-align:center;}.bd-field.filled{color:var(--text);}.wheel-box{margin-top:34px;margin-bottom:auto;background:var(--glow-card);border:1px solid var(--green);border-radius:12px;position:relative;overflow:hidden;animation:fcGlow 2s ease-in-out infinite;box-shadow:0 0 10px 2px rgba(1,214,118,.3);}.wheel-highlight{position:absolute;left:10px;right:10px;top:50%;height:48px;transform:translateY(-50%);background:rgba(255,255,255,.06);border-radius:12px;pointer-events:none;}.wheels{position:relative;display:grid;grid-template-columns:1.25fr .8fr 1fr;height:240px;-webkit-mask-image:linear-gradient(transparent 6%,#000 32%,#000 68%,transparent 94%);mask-image:linear-gradient(transparent 6%,#000 32%,#000 68%,transparent 94%);}.wheel{height:100%;overflow-y:scroll;scrollbar-width:none;scroll-snap-type:y mandatory;}.wheel::-webkit-scrollbar{display:none;}.wheel-item{height:48px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:17px;font-weight:500;color:var(--dim);cursor:pointer;}.wheel-item.sel{color:var(--text);font-weight:700;}.wheel-spacer{height:96px;}.btn-confirm{padding:18px 24px;border-radius:18px;font-size:15px;font-weight:700;letter-spacing:.06em;background:#262a31;color:#6a6f78;cursor:not-allowed;transition:background .2s ease,color .2s ease,box-shadow .2s ease;}.btn-confirm.ready{background:var(--green);color:#141523;cursor:pointer;box-shadow:0 12px 32px rgba(1,214,118,.3);}.btn-confirm.ready:active{transform:scale(.985);}#page-final{padding-top:clamp(48px,11vh,110px);}.final-kicker{text-align:center;color:var(--green);font-size:13px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;}.final-title{margin-top:12px;text-align:center;font-size:clamp(30px,8vw,40px);font-weight:700;}.final-sub{margin-top:10px;text-align:center;font-size:14.5px;color:var(--muted);line-height:1.6;}.steps{margin-top:30px;display:flex;flex-direction:column;gap:16px;}.step-card{display:flex;align-items:center;gap:14px;background:var(--glow-card);border:1px solid var(--green);border-radius:12px;padding:18px 20px;animation:fcGlow 2s ease-in-out infinite;box-shadow:0 0 10px 2px rgba(1,214,118,.3);}.step-icon{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(1,214,118,.12);display:grid;place-items:center;}.step-icon svg{width:22px;height:22px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}.step-title{font-size:16px;font-weight:700;}.step-desc{margin-top:3px;font-size:13px;color:var(--muted);line-height:1.45;}.btn-final{margin-top:auto;padding:19px 24px;border-radius:14px;background:var(--green);color:#141523;font-size:16px;font-weight:700;box-shadow:0 12px 32px rgba(1,214,118,.3);transition:transform .15s ease,filter .15s ease;}.btn-final:hover{filter:brightness(1.06);transform:translateY(-1px);}.btn-final:active{transform:scale(.985);}</style>

const MONTHS = ["January","February","March","April","May","June","July",

const ITEM_H = 48, WHEEL_H = 240, SPACER = (WHEEL_H - ITEM_H) / 2;

function buildWheel(el, values) {
el.innerHTML = "";

values.forEach((v, i) => {
const item = document.createElement("div");
item.className = "wheel-item";

el.appendChild(item);

["pointerdown", "wheel", "touchstart", "keydown"].forEach((ev) =>

function paintSelection(el, idx) {
